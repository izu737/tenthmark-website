<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noise Eraser</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg:     #0d1117;
  --panel:  #161b22;
  --raised: #1f2937;
  --accent: #3b82f6;
  --ok:     #22c55e;
  --hot:    #ef4444;
  --t1:     #e2e8f0;
  --t2:     #94a3b8;
  --t3:     #4b5563;
  --border: #2d3748;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg:     #f1f5f9;
    --panel:  #ffffff;
    --raised: #f8fafc;
    --t1:     #0f172a;
    --t2:     #64748b;
    --t3:     #94a3b8;
    --border: #e2e8f0;
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--t1);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 24px;
}
.drop-zone {
  width: min(480px, 100%);
  border: 2px dashed var(--border);
  border-radius: 16px;
  padding: 48px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  text-align: center;
}
.drop-zone:hover, .drop-zone.over {
  border-color: var(--accent);
  background: rgba(59,130,246,.06);
}
.drop-icon  { font-size: 52px; line-height: 1; }
.drop-title { font-size: 17px; font-weight: 600; }
.drop-sub   { font-size: 13px; color: var(--t2); }
.pick-btn {
  margin-top: 6px;
  padding: 9px 22px;
  border-radius: 8px; border: none;
  background: var(--accent); color: #fff;
  font: 600 13px 'Inter', sans-serif;
  cursor: pointer; transition: opacity .15s;
}
.pick-btn:hover { opacity: .85; }
.app { display: none; flex-direction: column; width: 100%; max-width: 860px; }
.top-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  background: var(--panel);
  border: 1px solid var(--border); border-bottom: none;
  border-radius: 12px 12px 0 0;
}
.file-name {
  flex: 1; font-size: 13px; font-weight: 500; color: var(--t2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 500; padding: 3px 9px;
  border-radius: 20px; flex-shrink: 0;
  background: rgba(59,130,246,.15); color: var(--accent);
}
.badge::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
.change-btn {
  padding: 5px 12px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--raised);
  color: var(--t2); font: 500 12px 'Inter', sans-serif; cursor: pointer;
}
.change-btn:hover { color: var(--t1); }
.canvas-wrap {
  background: #000;
  border-left: 1px solid var(--border); border-right: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  min-height: 200px; max-height: 420px; overflow: hidden;
}
#display { max-width: 100%; max-height: 420px; display: block; }
.vc {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--panel);
  border: 1px solid var(--border); border-top: none; border-bottom: none;
}
.play-btn {
  width: 30px; height: 30px; border-radius: 50%; border: none;
  background: var(--accent); color: #fff; font-size: 12px;
  cursor: pointer; flex-shrink: 0; transition: opacity .15s;
  display: flex; align-items: center; justify-content: center;
}
.play-btn:hover { opacity: .82; }
#seek { flex: 1; }
input[type=range] {
  -webkit-appearance: none; appearance: none;
  height: 4px; background: var(--border); border-radius: 2px; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.time { font-size: 11px; color: var(--t2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bottom-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 0 0 12px 12px;
}
.exp-btn {
  padding: 8px 20px; border-radius: 8px; border: none;
  background: var(--ok); color: #fff;
  font: 600 13px 'Inter', sans-serif;
  cursor: pointer; transition: opacity .15s; flex-shrink: 0;
}
.exp-btn:hover   { opacity: .85; }
.exp-btn.busy    { background: var(--hot); }
.exp-btn:disabled { opacity: .4; cursor: default; }
.prog-wrap { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
.prog-fill { height: 100%; background: var(--ok); width: 0%; transition: width .2s; }
.status { font-size: 12px; color: var(--t2); white-space: nowrap; }
</style>
</head>
<body>

<div class="drop-zone" id="dropZone">
  <div class="drop-icon">&#128263;</div>
  <div class="drop-title">Drop a video here</div>
  <div class="drop-sub">Noise is removed automatically &mdash; no settings needed</div>
  <button class="pick-btn" id="pickBtn">Choose Video</button>
  <input type="file" id="fileInput" accept="video/*" hidden>
</div>

<div class="app" id="app">
  <div class="top-bar">
    <span class="file-name" id="fileName"></span>
    <span class="badge">Noise removed</span>
    <button class="change-btn" id="changeBtn">Change file</button>
  </div>
  <div class="canvas-wrap">
    <canvas id="display"></canvas>
  </div>
  <div class="vc">
    <button class="play-btn" id="playBtn">&#9654;</button>
    <input type="range" id="seek" min="0" max="100" step="0.01" value="0">
    <span class="time" id="timeLbl">0:00 / 0:00</span>
  </div>
  <div class="bottom-bar">
    <button class="exp-btn" id="expBtn">Export clean video</button>
    <div class="prog-wrap"><div class="prog-fill" id="progFill"></div></div>
    <span class="status" id="status">Ready to export</span>
  </div>
</div>

<video id="vid" playsinline style="display:none"></video>
<canvas id="proc" style="display:none"></canvas>

<script>
'use strict';
const CFG={gate:-42,hp:80,lp:12000,spatial:1.5,temporal:25};
const $=id=>document.getElementById(id);
const vid=$('vid'),proc=$('proc'),display=$('display');
const dropZone=$('dropZone'),app=$('app'),fileName=$('fileName');
const playBtn=$('playBtn'),seek=$('seek'),timeLbl=$('timeLbl');
const expBtn=$('expBtn'),progFill=$('progFill'),status=$('status');
const S={audioCtx:null,nodes:{},loopId:null,gateId:null,prevRef:{v:null},exporting:false,recorder:null,chunks:[]};
const fmt=s=>{if(!isFinite(s))return'0:00';return`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;};
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('over');});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('over'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('over');const f=e.dataTransfer.files[0];if(f)loadFile(f);});
$('pickBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=()=>{if($('fileInput').files[0])loadFile($('fileInput').files[0]);};
$('changeBtn').onclick=()=>{teardown();app.style.display='none';dropZone.style.display='flex';};
async function loadFile(file){
  teardown();
  if(vid.src)URL.revokeObjectURL(vid.src);
  vid.src=URL.createObjectURL(file);
  await new Promise((res,rej)=>{vid.onloadedmetadata=res;vid.onerror=rej;});
  const sc=Math.min(1,1280/vid.videoWidth,720/vid.videoHeight);
  proc.width=Math.round(vid.videoWidth*sc);proc.height=Math.round(vid.videoHeight*sc);
  display.width=proc.width;display.height=proc.height;
  fileName.textContent=file.name;
  dropZone.style.display='none';app.style.display='flex';
  seek.max=vid.duration||100;
  status.textContent='Ready to export';progFill.style.width='0%';
  expBtn.disabled=false;expBtn.textContent='Export clean video';expBtn.classList.remove('busy');
  setupAudio();startLoop();
  vid.play().catch(()=>{});playBtn.textContent='⏸';
}
function setupAudio(){
  try{
    S.audioCtx=new AudioContext();
    const ctx=S.audioCtx;
    const src=ctx.createMediaElementSource(vid);
    const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=CFG.hp;hp.Q.value=0.7;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=CFG.lp;lp.Q.value=0.7;
    const an=ctx.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=0.6;
    const gate=ctx.createGain();gate.gain.value=1;
    const comp=ctx.createDynamicsCompressor();
    comp.threshold.value=-24;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.25;
    const rec=ctx.createMediaStreamDestination();
    src.connect(hp);hp.connect(lp);lp.connect(an);an.connect(gate);gate.connect(comp);
    comp.connect(ctx.destination);comp.connect(rec);
    S.nodes={an,gate,rec};
    const tdd=new Float32Array(an.fftSize);
    (function gateLoop(){
      an.getFloatTimeDomainData(tdd);
      let s=0;for(let i=0;i<tdd.length;i++)s+=tdd[i]*tdd[i];
      const db=20*Math.log10(Math.sqrt(s/tdd.length)||1e-7);
      const open=db>=CFG.gate;
      gate.gain.setTargetAtTime(open?1:0.0005,ctx.currentTime,open?0.004:0.025);
      S.gateId=requestAnimationFrame(gateLoop);
    })();
  }catch(e){console.warn('Audio unavailable:',e);}
}
const pCtx=proc.getContext('2d',{willReadFrequently:true});
const dCtx=display.getContext('2d');
function applyDenoise(src,ctx,W,H,ref){
  ctx.filter=`blur(${CFG.spatial}px)`;
  ctx.drawImage(src,0,0,W,H);
  ctx.filter='none';
  const cur=ctx.getImageData(0,0,W,H);
  if(ref.v){const a=1-CFG.temporal/100,c=cur.data,p=ref.v.data;for(let i=0;i<c.length;i+=4){c[i]=(c[i]*a+p[i]*(1-a))|0;c[i+1]=(c[i+1]*a+p[i+1]*(1-a))|0;c[i+2]=(c[i+2]*a+p[i+2]*(1-a))|0;}ctx.putImageData(cur,0,0);}
  ref.v=cur;
}
function startLoop(){stopLoop();drawLoop();}
function stopLoop(){if(S.loopId){cancelAnimationFrame(S.loopId);S.loopId=null;}}
function drawLoop(){
  if(vid.readyState>=2){
    applyDenoise(vid,pCtx,proc.width,proc.height,S.prevRef);
    dCtx.drawImage(proc,0,0,display.width,display.height);
    if(vid.duration){seek.value=vid.currentTime;timeLbl.textContent=`${fmt(vid.currentTime)} / ${fmt(vid.duration)}`;}
  }
  S.loopId=requestAnimationFrame(drawLoop);
}
playBtn.onclick=async()=>{
  if(S.audioCtx?.state==='suspended')await S.audioCtx.resume();
  if(vid.paused){vid.play();playBtn.textContent='⏸';}else{vid.pause();playBtn.textContent='▶';}
};
vid.onended=()=>{playBtn.textContent='▶';};
seek.oninput=()=>{vid.currentTime=parseFloat(seek.value);S.prevRef.v=null;};
expBtn.onclick=()=>S.exporting?cancelExport():startExport();
async function startExport(){
  if(S.audioCtx?.state==='suspended')await S.audioCtx.resume();
  S.exporting=true;S.chunks=[];
  expBtn.textContent='Cancel export';expBtn.classList.add('busy');
  status.textContent='Exporting (real time)…';progFill.style.width='0%';
  const ec=document.createElement('canvas');
  ec.width=vid.videoWidth;ec.height=vid.videoHeight;
  const eCtx=ec.getContext('2d',{willReadFrequently:true});
  const ePrev={v:null};
  vid.pause();vid.currentTime=0;
  await new Promise(r=>{vid.onseeked=r;});
  const vs=ec.captureStream(30);
  const stream=S.nodes.rec?new MediaStream([...vs.getVideoTracks(),...S.nodes.rec.stream.getAudioTracks()]):vs;
  const mime=['video/webm;codecs=vp9,opus','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||'video/webm';
  const mr=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000});
  S.recorder=mr;
  mr.ondataavailable=e=>{if(e.data?.size>0)S.chunks.push(e.data);};
  mr.onstop=()=>{
    if(!S.exporting)return;
    const blob=new Blob(S.chunks,{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='clean.webm';a.click();
    URL.revokeObjectURL(url);
    finishExport('✓ Done — clean.webm saved');
  };
  let eId;
  function eFrame(){
    if(!S.exporting)return;
    if(vid.readyState>=2)applyDenoise(vid,eCtx,ec.width,ec.height,ePrev);
    if(vid.duration){const p=vid.currentTime/vid.duration*100;progFill.style.width=p.toFixed(1)+'%';status.textContent=`Exporting ${p.toFixed(0)}% — ${fmt(vid.currentTime)} / ${fmt(vid.duration)}`;}
    eId=requestAnimationFrame(eFrame);
  }
  vid.addEventListener('ended',()=>{cancelAnimationFrame(eId);mr.stop();},{once:true});
  mr.start(100);eFrame();vid.play();
}
function cancelExport(){S.exporting=false;if(S.recorder?.state!=='inactive')S.recorder?.stop();finishExport('Export cancelled');}
function finishExport(msg){S.exporting=false;S.recorder=null;expBtn.textContent='Export clean video';expBtn.classList.remove('busy');progFill.style.width='0%';status.textContent=msg;vid.pause();playBtn.textContent='▶';}
function teardown(){stopLoop();if(S.gateId){cancelAnimationFrame(S.gateId);S.gateId=null;}if(S.audioCtx){S.audioCtx.close().catch(()=>{});S.audioCtx=null;}S.nodes={};S.prevRef.v=null;S.exporting=false;vid.pause();}
</script>
</body>
</html>
